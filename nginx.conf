server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # cererile API merg către containerul `server` (rețeaua docker-compose)
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: orice rută necunoscută servește index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
