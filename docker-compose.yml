# Rulează tot stack-ul containerizat: `docker compose up --build`
# Frontend: http://localhost:8080  ·  API proxat prin nginx la /api  ·  PostgreSQL
#
# Acordare admin (rol doar prin CLI, niciodată prin API):
#   docker compose exec server npm run admin -- set <email> on
#   docker compose exec server npm run admin -- list
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notationsoft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notationsoft"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    environment:
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-schimba-ma-in-productie}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/notationsoft
      # URL-ul frontend-ului (redirect Stripe după plată). În stack-ul Docker
      # web-ul e pe :8080.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      # Plăți (OPȚIONAL): fără chei Stripe, upgrade-ul la Pro folosește pagina de
      # plată SIMULATĂ (demo). Pune-le în `.env`-ul din rădăcină pentru Stripe test.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000" # opțional, pentru depanare directă a API-ului
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
